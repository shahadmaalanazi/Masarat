services:
  - type: web
    name: masaraat-agents
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python deploy_demo.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://shahadmaalanazi.github.io

